* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: 'Source Sans 3', system-ui, sans-serif; background: var(--parchment); color: var(--ink); }
#app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
#nav { width: 260px; min-width: 260px; background: var(--parchment-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
#nav-header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
#nav-header h1 { font-family: 'Crimson Text', serif; font-size: 1.4rem; font-weight: 600; color: var(--rubric); letter-spacing: 0.02em; }
#nav-header .subtitle { font-size: 0.7rem; color: var(--ink-soft); margin-top: 2px; }
#nav-header-actions { display: flex; flex-wrap: nowrap; gap: 6px; margin-top: 10px; align-items: center; }
#nav-header-actions .nav-action-btn { flex: 1 1 auto; min-width: 0; padding: 6px 4px; font-size: 0.7rem; border-radius: 6px; border: 1px solid var(--line); background: var(--parchment); color: var(--ink); cursor: pointer; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nav-header-actions .nav-action-btn:hover { background: var(--gold-soft); border-color: var(--gold); }
#nav-search { padding: 8px 12px; flex-shrink: 0; }
#nav-search input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--parchment); color: var(--ink); font-size: 0.85rem; }
#nav-books { flex: 1; overflow-y: auto; padding: 4px 0; }
.book-item { padding: 8px 14px; cursor: pointer; font-size: 0.9rem; border-left: 3px solid transparent; }
.book-item:hover { background: var(--gold-soft); }
.book-item.active { background: var(--gold-soft); border-left-color: var(--gold); font-weight: 600; }
.chapter-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 8px 12px; }
.chapter-btn { padding: 6px; text-align: center; border-radius: 6px; border: 1px solid var(--line); background: var(--parchment); cursor: pointer; font-size: 0.8rem; }
.chapter-btn:hover, .chapter-btn.active { background: var(--gold); color: var(--stage-jump-text); border-color: var(--gold); }
#reader { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
#topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--parchment-2); flex-shrink: 0; gap: 8px; overflow: visible; position: relative; z-index: 100; }
#topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
#topbar-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
.btn, .btn-icon { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--parchment); color: var(--ink); cursor: pointer; font-size: 0.8rem; white-space: nowrap; }
.btn:hover, .btn-icon:hover { background: var(--gold-soft); border-color: var(--gold); }
#reader-content { flex: 1; overflow-y: auto; padding: 20px 24px; scroll-behavior: smooth; }
#reader.welcome-fixed { display: flex; align-items: center; justify-content: center; }
#reader.welcome-fixed #reader-content { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 20px; }
.welcome-box { max-width: 520px; text-align: center; padding: 32px 28px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
.welcome-box h2 { font-family: 'Crimson Text', serif; font-size: 1.8rem; color: var(--rubric); margin-bottom: 12px; }
.welcome-box p { color: var(--ink-soft); line-height: 1.5; margin-bottom: 8px; }
.verse { padding: 6px 0; line-height: 1.55; cursor: pointer; border-radius: 4px; }
.verse:hover { background: var(--gold-soft); }
.verse.selected { background: rgba(212,175,55,0.18); box-shadow: inset 3px 0 0 var(--gold); }
.verse.active-detail { background: rgba(199,91,84,0.12); box-shadow: inset 3px 0 0 var(--rubric); }
.verse-num { font-weight: 600; color: var(--rubric); margin-right: 6px; font-size: 0.85em; }
/* Tooltips */
[data-tooltip] { position: relative; }
[data-tooltip]::after { content: attr(data-tooltip); position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 6px; padding: 5px 10px; background: var(--ink); color: var(--parchment); font-size: 0.72rem; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 20000; }
[data-tooltip]:hover::after { opacity: 1; }
/* Media queries for compact sidebar and small screens */
@media (max-width: 1366px) {
  #nav { width: 230px !important; min-width: 230px !important; }
  #nav-header-actions .nav-action-btn { font-size: 0.65rem; padding: 5px 3px; }
}
@media (max-width: 1200px) {
  #nav { width: 210px !important; min-width: 210px !important; }
}
@media (max-width: 1100px) {
  #nav { width: 200px !important; min-width: 200px !important; }
}
@media (max-width: 1024px) {
  #nav { width: 190px !important; min-width: 190px !important; }
  #nav-header h1 { font-size: 1.2rem; }
  #nav-header-actions .nav-action-btn { font-size: 0.6rem; padding: 4px 2px; }
}
@media (max-width: 900px) {
  #nav { width: 180px !important; min-width: 180px !important; }
}
@media (max-width: 800px) {
  #nav { width: 170px !important; min-width: 170px !important; }
  .welcome-box { padding: 24px 18px; }
  .welcome-box h2 { font-size: 1.5rem; }
}
/* Stage / projection mode */
#stage { display: none; position: fixed; inset: 0; background: var(--stage-bg); color: var(--stage-text); z-index: 50000; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
#stage.active { display: flex; }
#stage .stage-ref { font-size: 1.2rem; color: var(--stage-accent); margin-bottom: 16px; }
#stage .stage-text { font-family: 'Crimson Text', serif; font-size: 2.4rem; line-height: 1.4; max-width: 900px; }
